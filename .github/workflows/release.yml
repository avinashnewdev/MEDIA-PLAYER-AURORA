name: Build & Publish Aurora (EXE + APK + iOS)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 1. BUILD WINDOWS (.EXE) PORTABLE
  build-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build Windows EXE via Electron-Builder
        run: |
          npm install
          npx electron-builder --win --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Aurora-Windows-EXE
          path: dist/*.exe

  # 2. BUILD ANDROID (.APK)
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Bundle Web Assets & Build Android APK
        run: |
          mkdir -p www
          cp index.html www/index.html
          cp manifest.webmanifest sw.js icon-512.png icon-192.png www/ || true
          npm install
          npx cap init "Aurora Music" "com.avinash.auroraplayer" --web-dir www
          npx cap add android || true
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug
          mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Aurora-Media-Player.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Aurora-Android-APK
          path: android/app/build/outputs/apk/debug/Aurora-Media-Player.apk

  # 3. BUILD iOS (.IPA)
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build Unsigned iOS IPA
        run: |
          mkdir -p www
          cp index.html www/index.html
          cp manifest.webmanifest sw.js icon-512.png icon-192.png www/ || true
          npm install
          npx cap init "Aurora Music" "com.avinash.auroraplayer" --web-dir www
          npx cap add ios || true
          npx cap sync ios
          cd ios/App
          if [ -d "App.xcworkspace" ]; then
            xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO EXPANDED_CODE_SIGN_IDENTITY="" AD_HOC_CODE_SIGNING_ALLOWED=YES
          else
            xcodebuild -project App.xcodeproj -scheme App -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO EXPANDED_CODE_SIGN_IDENTITY="" AD_HOC_CODE_SIGNING_ALLOWED=YES
          fi
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r Aurora-Media-Player-iOS.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Aurora-iOS-IPA
          path: ios/App/Aurora-Media-Player-iOS.ipa

  # 4. PUBLISH ALL TO GITHUB RELEASES
  publish-release:
    needs: [build-exe, build-apk, build-ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish Free GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Aurora Media Player v1.0.${{ github.run_number }} (Windows + Android + iOS)"
          files: |
            artifacts/Aurora-Windows-EXE/*.exe
            artifacts/Aurora-Android-APK/*.apk
            artifacts/Aurora-iOS-IPA/*.ipa
