name: Build Aurora (Windows + Android + iOS)

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build portable Windows EXE
        run: npx electron-builder --win --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Aurora-Windows-EXE
          path: dist/*.exe
          if-no-files-found: error

  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install dependencies and configure Capacitor
        run: |
          npm install
          mkdir -p www
          cp index.html www/index.html
          cp manifest.webmanifest sw.js icon-512.png icon-192.png www/
          npx cap init "Aurora Music" "com.avinash.auroraplayer" --web-dir www
          npx cap add android
          npx cap sync android
      - name: Build Android debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Aurora-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies and configure Capacitor
        run: |
          npm install
          mkdir -p www
          cp index.html www/index.html
          cp manifest.webmanifest sw.js icon-512.png icon-192.png www/
          npx cap init "Aurora Music" "com.avinash.auroraplayer" --web-dir www
          npx cap add ios
          npx cap sync ios
      - name: Build unsigned iOS app bundle
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qr Aurora-Media-Player-iOS-UNSIGNED.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Aurora-iOS-UNSIGNED-IPA
          path: ios/App/Aurora-Media-Player-iOS-UNSIGNED.ipa
          if-no-files-found: error

  publish-release:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: [build-exe, build-apk, build-ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Aurora Media Player v1.0.${{ github.run_number }}"
          body: |
            Automated builds from this commit.
            The iOS IPA is unsigned and is not directly installable as a normal public iOS release.
          files: |
            artifacts/Aurora-Windows-EXE/*.exe
            artifacts/Aurora-Android-APK/*.apk
            artifacts/Aurora-iOS-UNSIGNED-IPA/*.ipa
